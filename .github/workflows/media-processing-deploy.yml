name: Build and Deploy Media Processing Service

on:
  push:
    branches:
      - main
    paths:
      - 'media-processing-service/**'
      - '.github/workflows/media-processing-deploy.yml'

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media-processing-service

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'
          cache: maven

      - name: Run tests
        run: ./mvnw -B test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.MEDIA_PROCESSING_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # kaniko builds without a Docker daemon, so it needs registry auth handed
      # to it as a docker config.json rather than via `docker login`.
      - name: Build Kaniko docker config for ECR auth
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"
          PASSWORD=$(aws ecr get-login-password --region "${{ vars.AWS_REGION }}")
          AUTH=$(printf 'AWS:%s' "$PASSWORD" | base64 -w0)

          mkdir -p "$HOME/.docker"
          cat > "$HOME/.docker/config.json" <<EOF
          {
            "auths": {
              "${REGISTRY}": {
                "auth": "${AUTH}"
              }
            }
          }
          EOF

          echo "REGISTRY=${REGISTRY}" >> "$GITHUB_ENV"

      - name: Build and push image with Kaniko
        run: |
          docker run --rm \
            -v "$HOME/.docker/config.json:/kaniko/.docker/config.json:ro" \
            -v "${{ github.workspace }}:/workspace" \
            gcr.io/kaniko-project/executor:v1.23.2 \
            --context "/workspace/media-processing-service" \
            --dockerfile "/workspace/media-processing-service/Dockerfile" \
            --destination "${REGISTRY}/${{ vars.MEDIA_PROCESSING_ECR_REPOSITORY_NAME }}:${{ github.sha }}" \
            --destination "${REGISTRY}/${{ vars.MEDIA_PROCESSING_ECR_REPOSITORY_NAME }}:latest" \
            --cache=true

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.MEDIA_PROCESSING_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The task definition points at the ":latest" tag, so a forced deployment
      # is enough to roll onto the image Kaniko just pushed — Fargate always
      # pulls fresh since each task gets its own ENI/host, there's no local
      # image cache to bust.
      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --service "${{ vars.ECS_SERVICE_NAME }}" \
            --force-new-deployment \
            --region "${{ vars.AWS_REGION }}"

      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --services "${{ vars.ECS_SERVICE_NAME }}" \
            --region "${{ vars.AWS_REGION }}"
