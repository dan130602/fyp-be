services:
  postgres:
    image: postgres:18-alpine
    container_name: ingestion-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: ingestion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ingestion" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  media-processing-service:
    build:
      context: ./media-processing-service
      dockerfile: Dockerfile
    container_name: media-processing-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ingestion
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      AWS_COGNITO_REGION: ${AWS_COGNITO_REGION:-ap-southeast-1}
      AWS_COGNITO_USER_POOL_ID: ${AWS_COGNITO_USER_POOL_ID:?set AWS_COGNITO_USER_POOL_ID}
      AWS_COGNITO_APP_CLIENT_ID: ${AWS_COGNITO_APP_CLIENT_ID:?set AWS_COGNITO_APP_CLIENT_ID}
      S3_BUCKET: ${S3_BUCKET:-ingestion-audio}
      S3_PRESIGNED_URL_EXPIRY_MINUTES: ${S3_PRESIGNED_URL_EXPIRY_MINUTES:-15}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS:-}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:-ChangeMe123!}
      TRANSCRIBE_STATUS_QUEUE_URL: ${TRANSCRIBE_STATUS_QUEUE_URL:-}
      TRANSCRIPT_HANDOFF_QUEUE_URL: ${TRANSCRIPT_HANDOFF_QUEUE_URL:-}
      CHECKLIST_JSON: ${CHECKLIST_JSON:-{}}
      # fyp-ai running on the host (docker run -p 2024:2024 ...)
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:2024}
      TRANSCRIBE_OUTPUT_BUCKET: ${TRANSCRIBE_OUTPUT_BUCKET:-ingestion-audio-output}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
