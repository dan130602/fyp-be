spring.application.name=media-processing-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ingestion}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- Logging ---
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG

# flyway & database
spring.flyway.enabled=true
spring.flyway.clean-disabled=false

app.aws.s3.bucket=ingestion-audio
app.aws.s3.presigned-url-expiry-minutes=${S3_PRESIGNED_URL_EXPIRY_MINUTES:15}
app.aws.s3.playback-url-expiry-minutes=${S3_PLAYBACK_URL_EXPIRY_MINUTES:60}

# --- Cognito ---
app.aws.cognito.region=${AWS_COGNITO_REGION:ap-southeast-1}
app.aws.cognito.user-pool-id=${AWS_COGNITO_USER_POOL_ID:ap-southeast-1_JyRMtIWYI}
app.aws.cognito.app-client-id=${AWS_COGNITO_APP_CLIENT_ID:43mfnnt61r839gang5dkh4hii9,6jde2h1pb3cqjuvcn6gbqvqbdu}
app.aws.cognito.issuer-uri=${AWS_COGNITO_ISSUER_URI:https://cognito-idp.${app.aws.cognito.region}.amazonaws.com/${app.aws.cognito.user-pool-id}}

# --- Upload validation ---
app.upload.max-files-per-request=${UPLOAD_MAX_FILES_PER_REQUEST:10}
app.upload.max-file-size-bytes=${UPLOAD_MAX_FILE_SIZE_BYTES:104857600}
app.upload.allowed-content-types=${UPLOAD_ALLOWED_CONTENT_TYPES:audio/mpeg,audio/wav,audio/x-wav,audio/mp4,audio/m4a}
app.upload.allowed-extensions=${UPLOAD_ALLOWED_EXTENSIONS:mp3,wav,m4a}

# --- CORS ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Security bootstrap ---
# Emails in this list get ADMIN instead of the default role, but only on their very
# first auto-provisioning - solves the chicken-and-egg problem of needing an ADMIN
# to create a user, with no ADMIN yet existing. Set only via env var in real deployments.
app.security.bootstrap-admin-emails=${BOOTSTRAP_ADMIN_EMAILS:danielleong02@gmail.com,test-manager@clearcall.local}

# Set as a permanent password on every admin-created Cognito user (school-project testing
# convenience - log in immediately, no invite-email/temp-password flow). Must satisfy the
# pool's password policy (min 8 chars, upper+lower+number+symbol). Change via env var.
app.security.default-user-password=${DEFAULT_USER_PASSWORD:ChangeMe123!}