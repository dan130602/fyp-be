[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fyp-evaluation"
version = "0.5.0"
description = "Independent contracts and validation for the FYP evaluation dataset"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.22,<5", "referencing>=0.35,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
augment = ["numpy>=2", "scipy>=1.11", "soundfile>=0.13"]
render = ["boto3[crt]>=1.41", "imageio-ffmpeg>=0.6", "python-dotenv>=1.0"]
llm = ["openai>=3.0,<4", "google-genai>=2.25,<3", "python-dotenv>=1.0"]

[project.scripts]
fyp-validate = "fyp_evaluation.validation.__main__:main"
fyp-transcripts = "fyp_evaluation.transcripts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
