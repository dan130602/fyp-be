[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fyp-evaluation"
version = "0.4.0"
description = "Independent contracts and validation for the FYP evaluation dataset"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.22,<5", "referencing>=0.35,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
fyp-validate = "fyp_evaluation.validation.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
